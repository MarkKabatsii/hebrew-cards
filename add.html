<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Додати слова — Іврит</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Frank+Ruhl+Libre:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="nav">
      <div class="logo">
        <span class="logo-mark" lang="he">א</span>
        <span>Іврит</span>
      </div>
      <div class="nav-links">
        <a href="index.html">Картки</a>
        <a href="add.html" aria-current="page">Додати слова</a>
        <a href="#">Колоди</a>
        <a href="#">Прогрес</a>
      </div>
      <button class="btn-text" id="signout">Вийти</button>
    </nav>

    <main class="main">
      <header class="hero">
        <h1>Додайте нове слово</h1>
        <p>Воно збережеться в базі й з'явиться серед карток.</p>
      </header>

      <form class="panel" id="form" novalidate>
        <label class="field">
          <span>Колода</span>
          <input
            id="deck"
            list="deckList"
            autocomplete="off"
            placeholder="Наприклад, Привітання"
          />
          <datalist id="deckList"></datalist>
        </label>
        <label class="field">
          <span>Іврит</span>
          <input
            id="he"
            class="input-he"
            lang="he"
            dir="rtl"
            autocomplete="off"
            placeholder="שָׁלוֹם"
          />
        </label>
        <label class="field">
          <span>Транскрипція</span>
          <input id="tr" autocomplete="off" placeholder="шалом" />
        </label>
        <label class="field">
          <span>Переклад</span>
          <input id="ua" autocomplete="off" placeholder="привіт, мир" />
        </label>
        <button class="btn-primary" type="submit">Додати слово</button>
        <p class="msg" id="msg" role="status"></p>
      </form>

      <section class="panel">
        <h2>Ваші слова</h2>
        <p class="muted" id="addedEmpty">
          Поки що нічого. Додані слова з'являться тут.
        </p>
        <ul class="word-list" id="added"></ul>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="store.js"></script>
    <script src="add.js"></script>
  </body>
</html>
